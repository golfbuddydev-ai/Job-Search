name: 4 - Tailor CVs

on:
  schedule:
    # Daily at 02:37 UTC. Costs nothing on days when no new roles are marked Y.
    # Times are UTC. To turn the schedule off, put a # at the start of
    # BOTH the "schedule:" line above and the "- cron" line below.
    - cron: "37 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: job-search-agent
  cancel-in-progress: false

jobs:
  tailor-cvs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Skips quietly on a schedule if the secrets aren't set yet (e.g. in the
      # original template repo), so nothing runs or costs anything until you
      # finish setup. If you run it by hand without them, it tells you why.
      - name: Check setup
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$GOOGLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::Setup not finished (secrets missing) -- skipping. See SETUP.md, step 5."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANTHROPIC_API_KEY and/or GOOGLE_SERVICE_ACCOUNT_JSON secret is missing. See SETUP.md, step 5."
            exit 1
          fi

      - name: Check out repo
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Write Google key file
        if: steps.check.outputs.ready == 'true'
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_KEY" > service_account.json

      - name: Write tailored CVs
        if: steps.check.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: python cv_tailor.py

      - name: Attach tailored CVs to this run (download under "Artifacts")
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tailored-cvs
          path: tailored_cvs/*.docx
          if-no-files-found: ignore
          retention-days: 30
